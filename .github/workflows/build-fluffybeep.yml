name: Build Fluffybeep

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Permite ejecución manual

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

    steps:
      - name: 🛎️ Checkout Patches (stickyfran/fluffybeep)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛎️ Checkout Fluffychat (Official Repo)
        uses: actions/checkout@v4
        with:
          repository: 'krille-chan/fluffychat'
          ref: '259bc72fb897e99303058712fcdfaee033bd4d33'
          path: 'fluffychat'

      - name: ⚙️ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🩹 Apply Fluffybeep Patches
        run: |
          git config --global user.email "fluffybeep@beeper.local"
          git config --global user.name "FluffyBeep Bot"
          cp -r patches fluffychat/patches
          cd fluffychat
          chmod +x ./patches/patch-manager.sh
          ./patches/patch-manager.sh patch-only

      - name: 📦 Install dependencies
        run: |
          cd fluffychat
          flutter pub get

      - name: 🔑 Copy Release Keystore
        run: |
          cp patches/release.keystore fluffychat/android/app/dummy.keystore
          cp patches/release.keystore fluffychat/android/dummy.keystore || true

      - name: 🏗️ Build APK
        run: |
          cd fluffychat
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: 📤 Upload APK Artifact (On Success)
        uses: actions/upload-artifact@v4
        with:
          name: fluffybeep-release-apk
          path: fluffychat/build/app/outputs/flutter-apk/*.apk
          retention-days: 7

      - name: 🧹 Remove Fluffychat Git Context
        run: rm -rf fluffychat/.git

      - name: 🚀 Release APK on GitHub Releases
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v1.2.1
          target_commitish: main
          name: "Fluffybeep v1.2.1 - RFC 7845 OGG Opus Voice Messages Fix"
          body: |
            ### 🚀 Fluffybeep v1.2.1 Release

            - **WhatsApp iOS Voice Notes Fix**: Normalized voice messages to strict RFC 7845 OGG Opus using FFmpegKit. Resolves 'Este audio ya no está disponible' playback error on WhatsApp iOS (iPhone).
            - **Native PTT Bubbles**: Guaranteed standard OGG stream with OpusHead/OpusTags and valid granule positions across Android and iPhone recipients.
            - **UI Fluidity & Performance**: Inherits the complete v1.2 performance refactor (ValueNotifiers, isolated chat list rebuilds, fast caching).

            **Highlights in v1.2:**
            - **Chat View Rebuild Isolation**: Replaced broad setState calls with dedicated ValueNotifiers, eliminated full Scaffold rebuilds on message tap, fixed memory leaks with TapGestureRecognizer.
            - **Chat List & Navigation Rail**: Added 250ms search debounce, optimized Navigation Rail unread counting ($O(N \times M) \to O(N)$), pre-filtered hidden space items, removed destructive AnimatedSwitcher in room list.
            - **Global Caching**: Added caches for DateFormat and Emoji collections, throttled command/mention autocomplete.
            - **Reliable Push Notifications & Audio**: Maintained ephemeral foreground sync, 48kHz Opus audio playback compatibility, permanent release keystore.
          files: fluffychat/build/app/outputs/flutter-apk/*.apk
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
          make_latest: true
