name: Build Fluffybeep

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Permite ejecución manual

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout Fluffychat (Official Repo)
        uses: actions/checkout@v4
        with:
          repository: 'krille-chan/fluffychat'
          submodules: recursive
          path: 'fluffychat'

      - name: 🛎️ Checkout Patches (stickyfran/fluffybeep)
        uses: actions/checkout@v4
        with:
          path: 'patches-repo'

      - name: ⚙️ Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: 🩹 Apply Fluffybeep Patches
        run: |
          # Copia la carpeta de parches al directorio de fluffychat
          cp -r patches-repo/patches fluffychat/patches
          cd fluffychat
          chmod +x ./patches/patch-manager.sh
          ./patches/patch-manager.sh patch-only

      - name: 📦 Install dependencies
        run: |
          cd fluffychat
          flutter pub get

      - name: 🏗️ Build APK
        run: |
          cd fluffychat
          flutter build apk --release

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluffybeep-release-apk
          path: fluffychat/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
