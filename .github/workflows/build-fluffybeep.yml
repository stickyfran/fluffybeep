name: Build Fluffybeep

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Permite ejecución manual

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # Importante para Fluffychat

      - name: ⚙️ Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true # Activa la caché para acelerar builds futuros

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🩹 Apply Fluffybeep Patches
        run: |
          chmod +x ./patches/patch-manager.sh
          ./patches/patch-manager.sh patch-only

      - name: 🏗️ Build APK
        run: flutter build apk --release

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluffybeep-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
