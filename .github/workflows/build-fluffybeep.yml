name: Build Fluffybeep

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Permite ejecución manual

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

    steps:
      - name: 🛎️ Checkout Patches (stickyfran/fluffybeep)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛎️ Checkout Fluffychat (Official Repo)
        uses: actions/checkout@v4
        with:
          repository: 'krille-chan/fluffychat'
          ref: '259bc72fb897e99303058712fcdfaee033bd4d33'
          submodules: recursive
          path: 'fluffychat'

      - name: ⚙️ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: 🩹 Apply Fluffybeep Patches
        run: |
          cp -r patches fluffychat/patches
          cd fluffychat
          chmod +x ./patches/patch-manager.sh
          ./patches/patch-manager.sh patch-only

      - name: 📦 Install dependencies
        run: |
          cd fluffychat
          flutter pub get

      - name: 🔑 Copy Release Keystore
        run: |
          cp patches/release.keystore fluffychat/android/app/dummy.keystore

      - name: 🏗️ Build APK
        run: |
          cd fluffychat
          flutter build apk --release

      - name: 📤 Upload APK Artifact (On Success)
        uses: actions/upload-artifact@v4
        with:
          name: fluffybeep-release-apk
          path: fluffychat/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: 🧹 Remove Fluffychat Git Context
        run: rm -rf fluffychat/.git

      - name: 🚀 Release APK on GitHub Releases
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v1.0.${{ github.run_number }}
          name: "Fluffybeep v1.0.${{ github.run_number }} - Beeper Patches"
          body: |
            ### Initial Release & Beeper Enhancements
            This release contains the custom compiled APK for Fluffychat with native Beeper bridge support.
            
            **Changes included:**
            - **Room Name Correction**: Fixes bridged direct messages (WhatsApp, Telegram, etc.) showing as "Grupo con [Nombre]" to display only the contact name.
            - **Beeper Re-sync**: Added a cache-clearing button in Settings to purge room metadata, profiles, and avatares safely.
            - **Reproducible Signatures**: Signed with a permanent keystore key to allow updating the app without reinstalling.
          files: fluffychat/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
          make_latest: true
          overwrite: true
