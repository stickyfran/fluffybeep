name: Build Fluffybeep

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Permite ejecución manual

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

    steps:
      - name: 🛎️ Checkout Patches (stickyfran/fluffybeep)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛎️ Checkout Fluffychat (Official Repo)
        uses: actions/checkout@v4
        with:
          repository: 'krille-chan/fluffychat'
          ref: '259bc72fb897e99303058712fcdfaee033bd4d33'
          path: 'fluffychat'

      - name: ⚙️ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🩹 Apply Fluffybeep Patches
        run: |
          git config --global user.email "fluffybeep@beeper.local"
          git config --global user.name "FluffyBeep Bot"
          cp -r patches fluffychat/patches
          cd fluffychat
          chmod +x ./patches/patch-manager.sh
          ./patches/patch-manager.sh patch-only

      - name: 📦 Install dependencies
        run: |
          cd fluffychat
          flutter pub get

      - name: 🔑 Copy Release Keystore
        run: |
          cp patches/release.keystore fluffychat/android/app/dummy.keystore
          cp patches/release.keystore fluffychat/android/dummy.keystore || true

      - name: 🏗️ Build APK
        run: |
          cd fluffychat
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: 📤 Upload APK Artifact (On Success)
        uses: actions/upload-artifact@v4
        with:
          name: fluffybeep-release-apk
          path: fluffychat/build/app/outputs/flutter-apk/*.apk
          retention-days: 7

      - name: 🧹 Remove Fluffychat Git Context
        run: rm -rf fluffychat/.git

      - name: 🚀 Release APK on GitHub Releases
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v1.1
          target_commitish: main
          name: "Fluffybeep v1.1 - Background Push & Performance Enhancements"
          body: |
            ### 🚀 Fluffybeep v1.1 Release

            This release brings major reliability improvements to background push notifications, performance optimizations, and bridge stability.

            **Highlights in v1.1:**
            - **Reliable Push Notifications (ntfy / UnifiedPush)**: Integrated an ephemeral background foreground service (`remoteMessaging`) to ensure the OS never kills the app process during push payload arrival and E2EE decryption (`oneShotSync`).
            - **Battery Optimization (Doze Mode) Exemption**: Added automated prompt and a dedicated Settings status tile (`Ajustes → Notificaciones → Segundo plano y Batería`) to prevent Android from delaying background broadcast intents.
            - **Massive Performance Optimizations**: Fixed UI jank and typing stutter by overhauling room cache invalidation (`_invalidateRoomCache` reduced from >400ms down to ~20-30ms) and isolating input field rebuilds.
            - **Voice Messages & Audio Fixes**: Added 48kHz Opus sample rate support and improved compatibility for WhatsApp bridged voice notes.
            - **Room Name & Bridge Consistency**: Resolved bridged DM naming issues and optimized avatar/profile bridge caching.
            - **Permanent Keystore**: Seamless update support without uninstalling.
          files: fluffychat/build/app/outputs/flutter-apk/*.apk
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
          make_latest: true
