name: Build Fluffybeep

on:
  push:
    branches:
      - main
      - master
      - '2.9'
  workflow_dispatch: # Permite ejecución manual

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

    steps:
      - name: 🛎️ Checkout Patches (stickyfran/fluffybeep)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛎️ Checkout Fluffychat (Official Repo)
        uses: actions/checkout@v4
        with:
          repository: 'krille-chan/fluffychat'
          ref: 'c9c58c24f04304cc2ec263d891073805468383b8'
          path: 'fluffychat'

      - name: ⚙️ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📝 Accept Android SDK & NDK Licenses
        run: |
          yes | flutter doctor --android-licenses || true
          yes | sdkmanager --licenses || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 🩹 Apply Fluffybeep Patches
        run: |
          git config --global user.email "fluffybeep@beeper.local"
          git config --global user.name "FluffyBeep Bot"
          cp -r patches fluffychat/patches
          cd fluffychat
          chmod +x ./patches/patch-manager.sh
          ./patches/patch-manager.sh patch-only

      - name: 📦 Install dependencies
        run: |
          cd fluffychat
          flutter pub get

      - name: 🔑 Copy Release Keystore
        run: |
          cp patches/release.keystore fluffychat/android/app/dummy.keystore
          cp patches/release.keystore fluffychat/android/dummy.keystore || true

      - name: 🏗️ Build APK
        run: |
          cd fluffychat
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: 🏷️ Prepare Release Artifacts
        run: |
          mkdir -p release-apks
          cp fluffychat/build/app/outputs/flutter-apk/app-release.apk release-apks/fluffybeep-2.9.4-v1.3.0.apk || true
          cp fluffychat/build/app/outputs/flutter-apk/*.apk release-apks/ || true

      - name: 📤 Upload APK Artifact (On Success)
        uses: actions/upload-artifact@v4
        with:
          name: fluffybeep-2.9.4-v1.3.0-apk
          path: release-apks/*.apk
          retention-days: 7

      - name: 🧹 Remove Fluffychat Git Context
        run: rm -rf fluffychat/.git

      - name: 🚀 Release APK on GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/2.9'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v1.3.0
          target_commitish: main
          name: "Fluffybeep v1.3.0 (FluffyChat 2.9.4 Base)"
          body: |
            ### 🚀 Fluffybeep v1.3.0 Release (Upstream FluffyChat 2.9.4 Base)

            - **Beeper Unified Contacts Merge**: Merge multiple chats and accounts (WhatsApp personal, WhatsApp business, Instagram, etc.) into unified contacts with seamless sibling quick-switch bar inside the chat view.
            - **Address Book Integration**: Match Matrix contacts directly with phone contacts safely using `flutter_contacts`.
            - **Robust SQLite Concurrency & WAL**: Fix `database is locked (code 5)` and prevent session loss on restart.
            - **WhatsApp iOS Voice Notes Fix**: Normalized PTT voice bubbles to strict RFC 7845 OGG Opus using FFmpegKit.
            - **Upstream FluffyChat 2.9.4 Base**: Inherits all modern upstream 2.9.4 improvements.
          files: release-apks/*.apk
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
          make_latest: true
